name: Build and publish Docker images
on:
  push:
    branches: [v1.0.0]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, database]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          component="${{ matrix.component }}"
          if [ "$component" = database ]; then component=db; fi
          echo "name=ghcr.io/$owner/free-mes-$component:v1.0.0" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  smoke-test:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: mes-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DB_PASSWORD: ci-only-password
      MES_PORT: '1111'
    steps:
      - uses: actions/checkout@v4
      - name: Start fresh containers
        run: docker compose -f deploy/compose.yml up -d --pull always
      - name: Verify captcha and login protection
        run: python3 deploy/smoke-test.py http://127.0.0.1:1111
      - name: Print container logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color --tail=150
      - name: Remove temporary containers and volumes
        if: always()
        run: docker compose -f deploy/compose.yml down --volumes --remove-orphans
